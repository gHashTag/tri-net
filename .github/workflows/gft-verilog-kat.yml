name: gft-verilog-kat
on:
  push:
    branches: [main]
# No pull_request paths filter: this check is REQUIRED by the main-branch ruleset
# (like the drift check), and a path-filtered required check never reports on PRs
# outside its paths -- GitHub then blocks their merge forever. ~4-5 min per PR is
# the price of requiring hardware-simulation execution.
  pull_request:

# Execute the GF-T specs' own test blocks IN SIMULATED HARDWARE: t27c
# icarus-simulate generates a self-checking Verilog testbench from the spec
# and runs it under Icarus Verilog. This is the gen-verilog leg of the ring's
# verification -- the same spec that drives the Rust verifier and the
# synthesizable silicon now has its assertions executed on the Verilog path
# too, so a codegen or spec regression on the hardware side cannot land
# silently. Requires t27c >= gHashTag/t27#1885 (assert lowering).
#
# Sweep result (2026-08-09 wave 51): 107 specs simulate clean -- the ENTIRE
# corpus now both compiles AND executes under Icarus (0 out of the gate). The
# final spec, rti_security, joins here: it carried a spec-side arithmetic
# assertion bug (3*100+10*10+200 asserted == 700, corrected to 600) that had
# survived only because NO gate exercised it (absent from the drift-rust,
# C-exec, and icarus lists at once). link_quality_monitor joined in wave 50,
# unlocked by t27#1994 (signed-aware ordered comparison): Verilog was doing an
# unsigned comparison where a signed i8 operand met an unsigned const (-16 read
# as 240); it now compares in the signed domain with C-promotion semantics. The batch of
# 6 in wave 49 (congestion_control, flow_control, network_simulator,
# production_scenarios, quarantine_manager, traffic_animator) was unlocked by
# t27#1991: test-block call temps are re-materialized after a rebinding, so the
# `st = op(st)` repeated-step pattern no longer reused a stale CSE snapshot.
# After the array
# chain (t27#1952/#1953), the SystemVerilog keyword class fell (t27#1957/#1958):
# spec identifiers named bit/byte/priority/sequence/table reached Icarus as
# keywords via raw declaration and part-select emissions. Remaining out: 31 compile-error specs (typed
# let-locals get no TB reg declaration; unsized concat operands; a
# fn-definition syntax class) and 17 runtime-divergence specs -- classified
# in t27#1948 and joining as the emission classes clear. crypto_frame and discovery are not lowerable
# BY DESIGN: they model host-side byte-layout parsing and use `usize` (host-width)
# in fn signatures, which the icarus classifier's primitive whitelist
# (u8/u16/u32/u64/i8..i64/bool) rightly excludes -- hardware has no host word
# and runs here. Unlocked by upstream t27#1885 (assert lowering), t27#1894
# (test-block reg declarations), t27#1886 (64-bit __mul_noop) and tri-net-side
# spec legalization (Verilog reserved words class/packed/small renamed; one
# stale tri_a2a hosted-skill test corrected -- caught by the simulation).

jobs:
  icarus-kat:
    name: GF-T spec KATs under Icarus Verilog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tri-net
        uses: actions/checkout@v4
        with:
          path: tri-net

      - name: Checkout t27 (SSOT compiler source)
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: master
          path: t27

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build t27c (release)
        working-directory: t27
        run: cargo build --release --manifest-path bootstrap/Cargo.toml --bin t27c

      - name: Simulate GF-T spec testbenches
        working-directory: tri-net
        run: |
          T27C=../t27/target/release/t27c
          STATUS=0
          # Single source of truth for the icarus KAT corpus. The coverage
          # guard below FAILS if any specs/*.t27 is absent from SPECS (or the
          # explicit EXCLUDE), so a newly added spec can never silently skip
          # hardware execution -- the missing invariant that let a broken spec
          # (rti_security) sit un-executed until wave 51.
          SPECS="tri_gft_add tri_gft_sub tri_gft_ladder tri_gft_arith tri_a2a tri_a2a_card tri_a2a_wire tri_challenge tri_compute_account tri_compute_bitnet tri_compute_bond tri_compute_challenge tri_compute_gfvalid tri_compute_optimistic tri_compute_payout tri_compute_pool tri_compute_receipt tri_compute_reputation tri_compute_safety tri_compute_settle tri_depin tri_fec tri_ilv tri_ledger tri_merkle tri_node_identity tri_receipt_verify tri_settle tri_sha256 tri_slash adaptive_retry area_optimization compression_engine crypto_frame discovery docs_generator etx frame_buffer gf16_format hardware_validation link_statistics modem_frame network_analytics network_metrics packet_queue performance_benchmarks performance_profiler routing_etx rti_alert self_healing test_framework test_validator timer timing_closure topology_visualizer transport_tx_fsm twr_timestamp video_bridge wire access_control adaptive_routing energy_aware_routing failure_predictor health_monitoring key_management multipath_routing network_coding redundancy_management trust_manager bandwidth_allocator byte_utils crc16 fault_detection pattern_predictor power_monitoring production_deployment resource_scheduler load_predictor anomaly_detector auto_config cache_management health_dashboard local_processing network_orchestrator integration_framework api_documenter multipath_router olsr_routing fpga_synthesis_report hello integration_tests lite_crypto mesh_routing packet_loss_injection mesh_node_sim mesh_protocol_stack cross_layer_optimizer m3_multihop swarm_coordinator congestion_control flow_control network_simulator production_scenarios quarantine_manager traffic_animator link_quality_monitor rti_security"
          EXCLUDE=""  # by-design host-width / non-lowerable specs: none today
          corpus=$(ls specs/*.t27 | sed 's#^specs/##; s#\.t27$##' | sort -u)
          covered=$(printf '%s %s\n' "$SPECS" "$EXCLUDE" | tr ' ' '\n' | sed '/^$/d' | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$corpus") <(printf '%s\n' "$covered"))
          if [ -n "$missing" ]; then
            echo "::error::coverage guard: spec(s) in specs/ but absent from the icarus KAT list (orphan risk):"
            echo "$missing" | sed 's/^/  - /'
            echo "Add them to SPECS in this workflow (or to EXCLUDE if host-width/by-design)."
            exit 1
          fi
          echo "coverage guard OK: all $(printf '%s\n' "$corpus" | wc -l | tr -d ' ') specs are gated"
          for spec in $SPECS; do
            echo "== ${spec}"
            if ! $T27C icarus-simulate specs/${spec}.t27 | tee /tmp/${spec}.simlog; then
              echo "::error file=specs/${spec}.t27::icarus-simulate failed for specs/${spec}.t27"
              STATUS=1
            fi
          done
          # Bench cycle budgets: the [BENCH] cycle counts are deterministic
          # (verified across repeated runs), so a count above budget is a real
          # regression of the generated datapath/testbench, not noise. Budgets
          # are the measured values at adoption; raise them ONLY with a spec
          # change that justifies it.
          check_budget() {
            spec="$1"; bench="$2"; budget="$3"
            got=$(grep "cycles" /tmp/${spec}.simlog | grep "${bench}" | grep -oE '[0-9]+$' | head -1)
            if [ -z "$got" ]; then
              echo "::error file=specs/${spec}.t27::bench ${bench} produced no cycle count"
              STATUS=1
            elif [ "$got" -gt "$budget" ]; then
              echo "::error file=specs/${spec}.t27::bench ${bench} took ${got} cycles > budget ${budget}"
              STATUS=1
            else
              echo "bench ${bench}: ${got} cycles (budget ${budget})"
            fi
          }
          check_budget tri_gft_add add_mantissa_sweep 34
          check_budget tri_gft_sub sub_mantissa_sweep 28
          check_budget tri_gft_ladder ladder_rung_walk 28
          check_budget tri_gft_arith mul_mantissa_sweep 28
          exit $STATUS
