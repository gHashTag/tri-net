name: gft-verilog-kat
on:
  push:
    branches: [main]
# No pull_request paths filter: this check is REQUIRED by the main-branch ruleset
# (like the drift check), and a path-filtered required check never reports on PRs
# outside its paths -- GitHub then blocks their merge forever. ~4-5 min per PR is
# the price of requiring hardware-simulation execution.
  pull_request:

# Execute the GF-T specs' own test blocks IN SIMULATED HARDWARE: t27c
# icarus-simulate generates a self-checking Verilog testbench from the spec
# and runs it under Icarus Verilog. This is the gen-verilog leg of the ring's
# verification -- the same spec that drives the Rust verifier and the
# synthesizable silicon now has its assertions executed on the Verilog path
# too, so a codegen or spec regression on the hardware side cannot land
# silently. Requires t27c >= gHashTag/t27#1885 (assert lowering).
#
# Sweep result (2026-08-08, t27c with #1885+#1899): every icarus-lowerable ring
# spec (30 of 32) simulates clean. crypto_frame and discovery are not lowerable
# BY DESIGN: they model host-side byte-layout parsing and use `usize` (host-width)
# in fn signatures, which the icarus classifier's primitive whitelist
# (u8/u16/u32/u64/i8..i64/bool) rightly excludes -- hardware has no host word
# and runs here. Unlocked by upstream t27#1885 (assert lowering), t27#1894
# (test-block reg declarations), t27#1886 (64-bit __mul_noop) and tri-net-side
# spec legalization (Verilog reserved words class/packed/small renamed; one
# stale tri_a2a hosted-skill test corrected -- caught by the simulation).

jobs:
  icarus-kat:
    name: GF-T spec KATs under Icarus Verilog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tri-net
        uses: actions/checkout@v4
        with:
          path: tri-net

      - name: Checkout t27 (SSOT compiler source)
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: master
          path: t27

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build t27c (release)
        working-directory: t27
        run: cargo build --release --manifest-path bootstrap/Cargo.toml --bin t27c

      - name: Simulate GF-T spec testbenches
        working-directory: tri-net
        run: |
          T27C=../t27/target/release/t27c
          STATUS=0
          for spec in tri_gft_add tri_gft_sub tri_gft_ladder tri_gft_arith tri_a2a tri_a2a_card tri_a2a_wire tri_challenge tri_compute_account tri_compute_bitnet tri_compute_bond tri_compute_challenge tri_compute_gfvalid tri_compute_optimistic tri_compute_payout tri_compute_pool tri_compute_receipt tri_compute_reputation tri_compute_safety tri_compute_settle tri_depin tri_fec tri_ilv tri_ledger tri_merkle tri_node_identity tri_receipt_verify tri_settle tri_sha256 tri_slash; do
            echo "== ${spec}"
            if ! $T27C icarus-simulate specs/${spec}.t27; then
              echo "::error file=specs/${spec}.t27::icarus-simulate failed for specs/${spec}.t27"
              STATUS=1
            fi
          done
          exit $STATUS
