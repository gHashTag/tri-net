name: gft-verilog-kat
on:
  push:
    branches: [main]
# No pull_request paths filter: this check is REQUIRED by the main-branch ruleset
# (like the drift check), and a path-filtered required check never reports on PRs
# outside its paths -- GitHub then blocks their merge forever. ~4-5 min per PR is
# the price of requiring hardware-simulation execution.
  pull_request:

# Execute the GF-T specs' own test blocks IN SIMULATED HARDWARE: t27c
# icarus-simulate generates a self-checking Verilog testbench from the spec
# and runs it under Icarus Verilog. This is the gen-verilog leg of the ring's
# verification -- the same spec that drives the Rust verifier and the
# synthesizable silicon now has its assertions executed on the Verilog path
# too, so a codegen or spec regression on the hardware side cannot land
# silently. Requires t27c >= gHashTag/t27#1885 (assert lowering).
#
# Sweep result (2026-08-09 wave 37): 69 specs simulate clean. The array chain
# is closed end-to-end: [T; N] packed params/returns (t27#1952), real TB
# assignments and text-based packed literals (t27#1953) flipped the nine
# array-driven mesh specs. Remaining out: 31 compile-error specs (typed
# let-locals get no TB reg declaration; unsized concat operands; a
# fn-definition syntax class) and 17 runtime-divergence specs -- classified
# in t27#1948 and joining as the emission classes clear. crypto_frame and discovery are not lowerable
# BY DESIGN: they model host-side byte-layout parsing and use `usize` (host-width)
# in fn signatures, which the icarus classifier's primitive whitelist
# (u8/u16/u32/u64/i8..i64/bool) rightly excludes -- hardware has no host word
# and runs here. Unlocked by upstream t27#1885 (assert lowering), t27#1894
# (test-block reg declarations), t27#1886 (64-bit __mul_noop) and tri-net-side
# spec legalization (Verilog reserved words class/packed/small renamed; one
# stale tri_a2a hosted-skill test corrected -- caught by the simulation).

jobs:
  icarus-kat:
    name: GF-T spec KATs under Icarus Verilog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tri-net
        uses: actions/checkout@v4
        with:
          path: tri-net

      - name: Checkout t27 (SSOT compiler source)
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: master
          path: t27

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build t27c (release)
        working-directory: t27
        run: cargo build --release --manifest-path bootstrap/Cargo.toml --bin t27c

      - name: Simulate GF-T spec testbenches
        working-directory: tri-net
        run: |
          T27C=../t27/target/release/t27c
          STATUS=0
          for spec in tri_gft_add tri_gft_sub tri_gft_ladder tri_gft_arith tri_a2a tri_a2a_card tri_a2a_wire tri_challenge tri_compute_account tri_compute_bitnet tri_compute_bond tri_compute_challenge tri_compute_gfvalid tri_compute_optimistic tri_compute_payout tri_compute_pool tri_compute_receipt tri_compute_reputation tri_compute_safety tri_compute_settle tri_depin tri_fec tri_ilv tri_ledger tri_merkle tri_node_identity tri_receipt_verify tri_settle tri_sha256 tri_slash adaptive_retry area_optimization compression_engine crypto_frame discovery docs_generator etx frame_buffer gf16_format hardware_validation link_statistics modem_frame network_analytics network_metrics packet_queue performance_benchmarks performance_profiler routing_etx rti_alert self_healing test_framework test_validator timer timing_closure topology_visualizer transport_tx_fsm twr_timestamp video_bridge wire access_control adaptive_routing energy_aware_routing failure_predictor health_monitoring key_management multipath_routing network_coding redundancy_management trust_manager; do
            echo "== ${spec}"
            if ! $T27C icarus-simulate specs/${spec}.t27 | tee /tmp/${spec}.simlog; then
              echo "::error file=specs/${spec}.t27::icarus-simulate failed for specs/${spec}.t27"
              STATUS=1
            fi
          done
          # Bench cycle budgets: the [BENCH] cycle counts are deterministic
          # (verified across repeated runs), so a count above budget is a real
          # regression of the generated datapath/testbench, not noise. Budgets
          # are the measured values at adoption; raise them ONLY with a spec
          # change that justifies it.
          check_budget() {
            spec="$1"; bench="$2"; budget="$3"
            got=$(grep "cycles" /tmp/${spec}.simlog | grep "${bench}" | grep -oE '[0-9]+$' | head -1)
            if [ -z "$got" ]; then
              echo "::error file=specs/${spec}.t27::bench ${bench} produced no cycle count"
              STATUS=1
            elif [ "$got" -gt "$budget" ]; then
              echo "::error file=specs/${spec}.t27::bench ${bench} took ${got} cycles > budget ${budget}"
              STATUS=1
            else
              echo "bench ${bench}: ${got} cycles (budget ${budget})"
            fi
          }
          check_budget tri_gft_add add_mantissa_sweep 34
          check_budget tri_gft_sub sub_mantissa_sweep 28
          check_budget tri_gft_ladder ladder_rung_walk 28
          check_budget tri_gft_arith mul_mantissa_sweep 28
          exit $STATUS
