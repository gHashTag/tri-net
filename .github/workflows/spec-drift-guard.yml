name: spec-drift-guard
# No pull_request paths filter: this check is REQUIRED by the main-branch ruleset,
# and a path-filtered required check never reports on PRs outside its paths --
# GitHub then blocks the merge waiting for it forever. Running on every PR
# (~4-5 min) is the price of requiring it.
on:
  push:
    branches: [main]
  pull_request:

# Rebuild t27c from upstream master and regenerate every committed backend
# under gen/<target>/<spec>.<ext> from specs/<spec>.t27. If any committed
# output disagrees with the freshly generated output, the job fails with a
# diff so drift between the SSOT and generated code cannot land silently.
#
# Covered specs: 68 x Rust (diffs rustfmt-normalized on both sides).
#   wire.t27  → gen/{rust,wire.rs}  gen/{zig,wire.zig}  gen/{c,wire.c}
#   hello.t27 → gen/{rust,hello.rs} gen/{zig,hello.zig} gen/{c,hello.c}
#   etx.t27   → gen/{rust,etx.rs}   gen/{zig,etx.zig}   gen/{c,etx.c}
#
# ExprCast is lowered in all three backends via t27#1320 (Rust) + t27#1337 (Zig+C).
# See docs/T27_FIRST_MIGRATION.md for the SSOT contract.
# Anchor: phi^2 + phi^-2 = 3.

jobs:
  regenerate-and-diff:
    name: drift check (68 specs × 3 backends)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tri-net
        uses: actions/checkout@v4
        with:
          path: tri-net

      - name: Checkout t27 (SSOT compiler source)
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: master
          path: t27

      - name: Install Zig
        run: |
          # setup-zig actions 404 on this release; fetch the official tarball.
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            || curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-linux-x86_64-0.15.2.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build t27c (release)
        working-directory: t27
        run: cargo build --release --manifest-path bootstrap/Cargo.toml --bin t27c

      - name: Typecheck — all specs
        working-directory: tri-net
        run: |
          # Full-corpus typecheck (not just staged files like the local hook):
          # arity mismatches are hard errors since t27#1922, literal inference
          # is context-polymorphic since t27#1924, and W456 is scoped to const
          # ROM since t27#1926 -- the whole corpus is expected clean.
          T27C=../t27/target/release/t27c
          STATUS=0
          for spec in specs/*.t27; do
            if ! $T27C typecheck "$spec" 2>&1 | grep -q "Typecheck OK"; then
              echo "::error file=${spec}::typecheck failed"
              $T27C typecheck "$spec" 2>&1 | grep '^  - ' | head -5
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Zig test — execute committed gens (passing set)
        working-directory: tri-net
        run: |
          # EXECUTION level (above ast-check): compile and RUN each committed
          # gen's test blocks. Gated to the passing set; the rest are tracked in
          # t27#1928 (the t27 saturation idiom needs +%, genuine runtime test
          # failures, two emission tails) and join as they clear -- ratchet, do
          # not regress.
          STATUS=0
          for spec in access_control adaptive_retry anomaly_detector api_documenter auto_config byte_utils cache_management compression_engine congestion_control crc16 docs_generator flow_control fpga_synthesis_report frame_buffer health_dashboard integration_framework link_quality_monitor link_statistics load_predictor local_processing m3_multihop mesh_node_sim mesh_routing multipath_router network_metrics network_orchestrator network_simulator olsr_routing performance_profiler quarantine_manager test_framework test_validator timer topology_visualizer traffic_animator transport_tx_fsm trust_manager power_monitoring tri_challenge area_optimization etx mesh_protocol_stack network_analytics performance_benchmarks self_healing timing_closure wire crypto_frame discovery gf16_format modem_frame routing_etx rti_alert tri_a2a tri_a2a_wire tri_compute_optimistic tri_compute_payout tri_compute_reputation tri_compute_safety tri_fec tri_gft_arith tri_ilv tri_node_identity tri_receipt_verify tri_slash packet_loss_injection tri_a2a_card tri_compute_gfvalid tri_gft_ladder tri_gft_add tri_gft_sub integration_tests tri_compute_settle tri_compute_bitnet tri_compute_receipt tri_depin tri_ledger tri_merkle bandwidth_allocator production_scenarios tri_compute_challenge hello multipath_routing tri_sha256 video_bridge lite_crypto pattern_predictor production_deployment adaptive_routing cross_layer_optimizer energy_aware_routing failure_predictor fault_detection health_monitoring key_management network_coding redundancy_management resource_scheduler swarm_coordinator hardware_validation packet_queue; do
            if ! zig test gen/zig/${spec}.zig -femit-bin=/tmp/zt_bin > /tmp/zt.log 2>&1; then
              echo "::error file=gen/zig/${spec}.zig::zig test failed"
              tail -5 /tmp/zt.log
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Drift check — all backends (gen/ is SSOT)
        working-directory: tri-net
        run: |
          # One table-driven loop replaces three copy-pasted per-backend steps.
          # gen/<dir> is the single source of truth (see #365/#366): every
          # committed gen is regenerated from its spec and diffed, so a new gen
          # auto-joins and none can be dropped from a list.
          #
          # Rust is normalized with rustfmt on BOTH sides: some gen/rust files are
          # #[path]-included into src/, so the `build + test` gate's
          # `cargo fmt --all --check` REQUIRES them rustfmt-formatted, while raw
          # t27c output is not. A byte-exact diff against raw t27c output made the
          # two gates mutually contradictory (the historic permanent red of this
          # leg). C and Zig have no formatter, so they diff byte-exact.
          T27C=../t27/target/release/t27c
          STATUS=0
          # dir ext t27c-subcommand expected-minimum-count
          while read -r dir ext sub floor; do
            [ -z "$dir" ] && continue
            n=0
            for spec in $(ls gen/${dir}/*.${ext} | sed "s#^gen/${dir}/##; s#\.${ext}\$##" | sort); do
              n=$((n + 1))
              if [ "$dir" = "rust" ]; then
                $T27C $sub specs/${spec}.t27 | rustfmt --edition 2021 > /tmp/drift_regen.${ext}
                rustfmt --edition 2021 < gen/${dir}/${spec}.${ext} > /tmp/drift_committed.${ext}
              else
                $T27C $sub specs/${spec}.t27 > /tmp/drift_regen.${ext}
                cp gen/${dir}/${spec}.${ext} /tmp/drift_committed.${ext}
              fi
              if ! diff -u /tmp/drift_committed.${ext} /tmp/drift_regen.${ext}; then
                echo "::error file=gen/${dir}/${spec}.${ext}::DRIFT: gen/${dir}/${spec}.${ext} != t27c ${sub} specs/${spec}.t27"
                echo "Fix: t27c ${sub} specs/${spec}.t27 > gen/${dir}/${spec}.${ext}"
                STATUS=1
              else
                echo "gen/${dir}/${spec}.${ext} matches specs/${spec}.t27"
              fi
            done
            # Ratchet: a refactor that made a backend silently match zero files
            # would otherwise report a FALSE GREEN. Fail if coverage drops.
            echo "${dir}: checked ${n} gens (floor ${floor})"
            if [ "$n" -lt "$floor" ]; then
              echo "::error::drift coverage for ${dir} dropped to ${n}, below the ${floor} floor"
              STATUS=1
            fi
          done <<'BACKENDS'
          rust rs gen-rust 86
          zig zig gen 107
          c c gen-c 75
          BACKENDS
          exit $STATUS
      - name: C test — compile and run committed gens (passing set)
        working-directory: tri-net
        run: |
          # C EXECUTION level (mirror of the zig-test step): compile each
          # committed C gen with its guarded runner and RUN it. FULL corpus
          # since t27#1947 ([T; N] by-value struct lowering) -- ratchet, do
          # not regress.
          STATUS=0
          # Iterate the committed gen/c directory directly: gen/ is the SSOT,
          # so every committed gen is executed/checked and none can be silently
          # dropped from a hand-maintained list (the orphan gap that hid a broken
          # rti_security until wave 51). A new gen/c/*.c auto-joins here.
          for spec in $(ls gen/c/*.c | sed 's#^gen/c/##; s#\.c$##' | sort); do
            if ! gcc -DT27_TEST_MAIN -o /tmp/ct_bin gen/c/${spec}.c > /tmp/ct.log 2>&1; then
              echo "::error::C test COMPILE failed for ${spec}"; tail -20 /tmp/ct.log; STATUS=1; continue
            fi
            if ! /tmp/ct_bin > /tmp/ct_run.log 2>&1; then
              echo "::error::C test RUN failed for ${spec}"; tail -20 /tmp/ct_run.log; STATUS=1
            fi
          done
          exit $STATUS

      # The Zig leg RETURNED 2026-08-08: the gen-zig validity campaign (t27#1910,
      # closed) took the backend from 66/68-invalid to 0/68, and gen/zig/ is
      # committed again -- all 68 files zig-ast-check clean. Byte-exact diff
      # against `t27c gen` (no formatter in the Zig path).
