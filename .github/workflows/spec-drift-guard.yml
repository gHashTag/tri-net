name: spec-drift-guard
# No pull_request paths filter: this check is REQUIRED by the main-branch ruleset,
# and a path-filtered required check never reports on PRs outside its paths --
# GitHub then blocks the merge waiting for it forever. Running on every PR
# (~4-5 min) is the price of requiring it.
on:
  push:
    branches: [main]
  pull_request:

# Rebuild t27c from upstream master and regenerate every committed backend
# under gen/<target>/<spec>.<ext> from specs/<spec>.t27. If any committed
# output disagrees with the freshly generated output, the job fails with a
# diff so drift between the SSOT and generated code cannot land silently.
#
# Covered specs: 68 x Rust (diffs rustfmt-normalized on both sides).
#   wire.t27  → gen/{rust,wire.rs}  gen/{zig,wire.zig}  gen/{c,wire.c}
#   hello.t27 → gen/{rust,hello.rs} gen/{zig,hello.zig} gen/{c,hello.c}
#   etx.t27   → gen/{rust,etx.rs}   gen/{zig,etx.zig}   gen/{c,etx.c}
#
# ExprCast is lowered in all three backends via t27#1320 (Rust) + t27#1337 (Zig+C).
# See docs/T27_FIRST_MIGRATION.md for the SSOT contract.
# Anchor: phi^2 + phi^-2 = 3.

jobs:
  regenerate-and-diff:
    name: drift check (68 specs × 3 backends)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tri-net
        uses: actions/checkout@v4
        with:
          path: tri-net

      - name: Checkout t27 (SSOT compiler source)
        uses: actions/checkout@v4
        with:
          repository: gHashTag/t27
          ref: master
          path: t27

      - name: Install Zig
        run: |
          # setup-zig actions 404 on this release; fetch the official tarball.
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            || curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.15.2/zig-linux-x86_64-0.15.2.tar.xz
          mkdir -p "$HOME/zig" && tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build t27c (release)
        working-directory: t27
        run: cargo build --release --manifest-path bootstrap/Cargo.toml --bin t27c

      - name: Typecheck — all specs
        working-directory: tri-net
        run: |
          # Full-corpus typecheck (not just staged files like the local hook):
          # arity mismatches are hard errors since t27#1922, literal inference
          # is context-polymorphic since t27#1924, and W456 is scoped to const
          # ROM since t27#1926 -- the whole corpus is expected clean.
          T27C=../t27/target/release/t27c
          STATUS=0
          for spec in specs/*.t27; do
            if ! $T27C typecheck "$spec" 2>&1 | grep -q "Typecheck OK"; then
              echo "::error file=${spec}::typecheck failed"
              $T27C typecheck "$spec" 2>&1 | grep '^  - ' | head -5
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Zig test — execute committed gens (passing set)
        working-directory: tri-net
        run: |
          # EXECUTION level (above ast-check): compile and RUN each committed
          # gen's test blocks. Gated to the passing set; the rest are tracked in
          # t27#1928 (the t27 saturation idiom needs +%, genuine runtime test
          # failures, two emission tails) and join as they clear -- ratchet, do
          # not regress.
          STATUS=0
          for spec in access_control adaptive_retry anomaly_detector api_documenter auto_config byte_utils cache_management compression_engine congestion_control crc16 docs_generator flow_control fpga_synthesis_report frame_buffer health_dashboard integration_framework link_quality_monitor link_statistics load_predictor local_processing m3_multihop mesh_node_sim mesh_routing multipath_router network_metrics network_orchestrator network_simulator olsr_routing performance_profiler quarantine_manager test_framework test_validator timer topology_visualizer traffic_animator transport_tx_fsm trust_manager power_monitoring tri_challenge area_optimization etx mesh_protocol_stack network_analytics performance_benchmarks self_healing timing_closure wire crypto_frame discovery gf16_format modem_frame routing_etx rti_alert tri_a2a tri_a2a_wire tri_compute_optimistic tri_compute_payout tri_compute_reputation tri_compute_safety tri_fec tri_gft_arith tri_ilv tri_node_identity tri_receipt_verify tri_slash packet_loss_injection tri_a2a_card tri_compute_gfvalid tri_gft_ladder tri_gft_add tri_gft_sub integration_tests tri_compute_settle tri_compute_bitnet tri_compute_receipt tri_depin tri_ledger tri_merkle bandwidth_allocator production_scenarios tri_compute_challenge hello multipath_routing tri_sha256 video_bridge lite_crypto pattern_predictor production_deployment adaptive_routing cross_layer_optimizer energy_aware_routing failure_predictor fault_detection health_monitoring key_management network_coding redundancy_management resource_scheduler swarm_coordinator hardware_validation packet_queue; do
            if ! zig test gen/zig/${spec}.zig -femit-bin=/tmp/zt_bin > /tmp/zt.log 2>&1; then
              echo "::error file=gen/zig/${spec}.zig::zig test failed"
              tail -5 /tmp/zt.log
              STATUS=1
            fi
          done
          exit $STATUS

      - name: Drift check — Rust (all specs)
        working-directory: tri-net
        run: |
          # Both sides are normalized with rustfmt before diffing: some gen/rust files are
          # #[path]-included into the src module tree, so the `build + test` gate's
          # `cargo fmt --all --check` REQUIRES them rustfmt-formatted, while raw t27c output
          # is not. A byte-exact diff against raw t27c output made the two gates mutually
          # contradictory for those files (the historic permanent red of this leg).
          # (2026-08-07) mesh_routing / multipath_router / traffic_animator were briefly
          # excluded here; their SPECS used illegal t27 (untyped bool locals, `let mut` +
          # tail expressions the parser silently dropped, a `type` parameter name). The
          # specs are fixed and all 68 are checked again. rustfmt failing loudly on either
          # side means an unparseable gen can never false-pass.
          T27C=../t27/target/release/t27c
          STATUS=0
          for spec in wire hello etx crc16 byte_utils mesh_routing key_management frame_buffer packet_queue congestion_control flow_control self_healing trust_manager timer transport_tx_fsm redundancy_management fault_detection lite_crypto network_metrics m3_multihop link_statistics access_control bandwidth_allocator cache_management compression_engine cross_layer_optimizer energy_aware_routing adaptive_retry link_quality_monitor multipath_router auto_config adaptive_routing anomaly_detector api_documenter area_optimization docs_generator fpga_synthesis_report health_dashboard health_monitoring integration_tests load_predictor local_processing mesh_node_sim mesh_protocol_stack multipath_routing network_coding network_orchestrator network_simulator olsr_routing pattern_predictor performance_benchmarks performance_profiler power_monitoring production_deployment production_scenarios quarantine_manager resource_scheduler swarm_coordinator test_framework timing_closure topology_visualizer traffic_animator failure_predictor hardware_validation integration_framework network_analytics packet_loss_injection test_validator; do
            $T27C gen-rust specs/${spec}.t27 | rustfmt --edition 2021 > /tmp/${spec}_regen.rs
            rustfmt --edition 2021 < gen/rust/${spec}.rs > /tmp/${spec}_committed.rs
            if ! diff -u /tmp/${spec}_committed.rs /tmp/${spec}_regen.rs; then
              echo "::error file=gen/rust/${spec}.rs::DRIFT: gen/rust/${spec}.rs != t27c gen-rust specs/${spec}.t27 (modulo rustfmt)"
              echo "Fix: t27c gen-rust specs/${spec}.t27 > gen/rust/${spec}.rs && cargo fmt --all"
              STATUS=1
            else
              echo "gen/rust/${spec}.rs matches specs/${spec}.t27"
            fi
          done
          exit $STATUS

      - name: C test — compile and run committed gens (passing set)
        working-directory: tri-net
        run: |
          # C EXECUTION level (mirror of the zig-test step): compile each
          # committed C gen with its guarded runner and RUN it. FULL corpus
          # since t27#1947 ([T; N] by-value struct lowering) -- ratchet, do
          # not regress.
          STATUS=0
          for spec in access_control adaptive_retry adaptive_routing anomaly_detector api_documenter area_optimization auto_config bandwidth_allocator byte_utils cache_management compression_engine congestion_control crc16 cross_layer_optimizer docs_generator energy_aware_routing etx failure_predictor fault_detection flow_control fpga_synthesis_report frame_buffer hardware_validation health_dashboard health_monitoring hello integration_framework integration_tests key_management link_quality_monitor link_statistics lite_crypto load_predictor local_processing m3_multihop mesh_node_sim mesh_protocol_stack mesh_routing multipath_router multipath_routing network_analytics network_coding network_metrics network_orchestrator network_simulator olsr_routing packet_loss_injection packet_queue pattern_predictor performance_benchmarks performance_profiler power_monitoring production_deployment production_scenarios quarantine_manager redundancy_management resource_scheduler self_healing swarm_coordinator test_framework test_validator timer timing_closure topology_visualizer traffic_animator transport_tx_fsm tri_challenge trust_manager wire; do
            if ! gcc -DT27_TEST_MAIN -o /tmp/ct_bin gen/c/${spec}.c > /tmp/ct.log 2>&1; then
              echo "::error::C test COMPILE failed for ${spec}"; tail -20 /tmp/ct.log; STATUS=1; continue
            fi
            if ! /tmp/ct_bin > /tmp/ct_run.log 2>&1; then
              echo "::error::C test RUN failed for ${spec}"; tail -20 /tmp/ct_run.log; STATUS=1
            fi
          done
          exit $STATUS

      # The Zig leg RETURNED 2026-08-08: the gen-zig validity campaign (t27#1910,
      # closed) took the backend from 66/68-invalid to 0/68, and gen/zig/ is
      # committed again -- all 68 files zig-ast-check clean. Byte-exact diff
      # against `t27c gen` (no formatter in the Zig path).
      - name: Drift check — Zig (all specs)
        working-directory: tri-net
        run: |
          T27C=../t27/target/release/t27c
          STATUS=0
          for spec in wire hello etx crc16 byte_utils mesh_routing key_management frame_buffer packet_queue congestion_control flow_control self_healing trust_manager timer transport_tx_fsm redundancy_management fault_detection lite_crypto network_metrics m3_multihop link_statistics access_control bandwidth_allocator cache_management compression_engine cross_layer_optimizer energy_aware_routing adaptive_retry link_quality_monitor multipath_router auto_config adaptive_routing anomaly_detector api_documenter area_optimization docs_generator fpga_synthesis_report health_dashboard health_monitoring integration_tests load_predictor local_processing mesh_node_sim mesh_protocol_stack multipath_routing network_coding network_orchestrator network_simulator olsr_routing pattern_predictor performance_benchmarks performance_profiler power_monitoring production_deployment production_scenarios quarantine_manager resource_scheduler swarm_coordinator test_framework timing_closure topology_visualizer traffic_animator failure_predictor hardware_validation integration_framework network_analytics packet_loss_injection test_validator crypto_frame discovery gf16_format modem_frame routing_etx rti_alert tri_a2a tri_a2a_wire tri_compute_optimistic tri_compute_payout tri_compute_reputation tri_compute_safety tri_fec tri_gft_arith tri_ilv tri_node_identity tri_receipt_verify tri_slash tri_a2a_card tri_compute_gfvalid tri_gft_ladder tri_gft_add tri_gft_sub tri_compute_settle tri_compute_bitnet tri_compute_receipt tri_depin tri_ledger tri_merkle tri_compute_challenge tri_sha256 video_bridge; do
            $T27C gen specs/${spec}.t27 > /tmp/${spec}_regen.zig
            if ! diff -u gen/zig/${spec}.zig /tmp/${spec}_regen.zig; then
              echo "::error file=gen/zig/${spec}.zig::DRIFT: gen/zig/${spec}.zig != t27c gen specs/${spec}.t27"
              echo "Fix: t27c gen specs/${spec}.t27 > gen/zig/${spec}.zig"
              STATUS=1
            else
              echo "gen/zig/${spec}.zig matches specs/${spec}.t27"
            fi
          done
          exit $STATUS


      # The C leg RETURNED 2026-08-08: the gen-c validity campaign (t27#1919,
      # t27#1920/#1927 + spec redesigns) took the backend from 64/68-invalid to
      # 0/68, and gen/c/ is committed again -- all 68 files gcc-syntax-clean.
      # Byte-exact diff against `t27c gen-c` (no formatter in the C path).
      - name: Drift check — C (all specs)
        working-directory: tri-net
        run: |
          T27C=../t27/target/release/t27c
          STATUS=0
          for spec in wire hello etx crc16 byte_utils mesh_routing key_management frame_buffer packet_queue congestion_control flow_control self_healing trust_manager timer transport_tx_fsm redundancy_management fault_detection lite_crypto network_metrics m3_multihop link_statistics access_control bandwidth_allocator cache_management compression_engine cross_layer_optimizer energy_aware_routing adaptive_retry link_quality_monitor multipath_router auto_config adaptive_routing anomaly_detector api_documenter area_optimization docs_generator fpga_synthesis_report health_dashboard health_monitoring integration_tests load_predictor local_processing mesh_node_sim mesh_protocol_stack multipath_routing network_coding network_orchestrator network_simulator olsr_routing pattern_predictor performance_benchmarks performance_profiler power_monitoring production_deployment production_scenarios quarantine_manager resource_scheduler swarm_coordinator test_framework timing_closure topology_visualizer traffic_animator failure_predictor hardware_validation integration_framework network_analytics packet_loss_injection test_validator; do
            $T27C gen-c specs/${spec}.t27 > /tmp/${spec}_regen.c
            if ! diff -u gen/c/${spec}.c /tmp/${spec}_regen.c; then
              echo "::error file=gen/c/${spec}.c::DRIFT: gen/c/${spec}.c != t27c gen-c specs/${spec}.t27"
              echo "Fix: t27c gen-c specs/${spec}.t27 > gen/c/${spec}.c"
              STATUS=1
            else
              echo "gen/c/${spec}.c matches specs/${spec}.t27"
            fi
          done
          exit $STATUS
